name: Java CI with Maven in Linux

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    strategy:
      matrix:
        java: [17, 21]

    name: Build with Java ${{ matrix.java }} on Linux
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
    - name: Cache Maven packages
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2
          ~/.sonar/cache
        key: ${{ runner.os }}-m2-jdk${{ matrix.java }}-${{ hashFiles('**/pom.xml', '**/*.yml') }}
        restore-keys: ${{ runner.os }}-m2-jdk${{ matrix.java }}-
    - name: Set Maven Additional Goals
      run: |
        echo "SONARGOAL=sonar:sonar" >> $GITHUB_ENV
      if: ${{ env.SONAR_TOKEN && matrix.java == 17 }}
    - name: Build with Maven and SonarCloud
      run: >
        xvfb-run mvn -f parking-slot-monitor/pom.xml verify -Pjacoco coveralls:report $SONARGOAL
        -Dsonar.organization=wissalbarhoumi03-hub
        -Dsonar.host.url=https://sonarcloud.io
        -Dsonar.projectKey=wissalbarhoumi03-hub_parking-slot-monitor
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
