# This workflow builds the project on Windows and macOS for pull requests
name: Java CI with Maven for PR on Windows and macOS

on:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    name: Build with Java 17 on ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: 'temurin'
    - name: Build with Maven
      run: mvn -f parking-slot-monitor/pom.xml clean verify -PskipTestcontainers